# Build the Sphinx documentation on pushes to main, dev, feature/** and fix/** and on pull requests; publish it to GitHub Pages
# from main. The previous workflow uploaded the whole repository as the Pages site.
name: Documentation

on:
  push:
    # feature and fix branches too, so a branch is checked before it is merged (also without a pull request)
    branches: ["main", "dev", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install documentation requirements
        # sphinx-autoapi parses src/ statically: no database, .env or pylovo install is needed.
        run: pip install -r docs/requirements.txt
      - name: Build HTML (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
