# Run the unit tests on pushes to main/dev and on pull requests. The database tests are opt-in and
# skip themselves, so nothing here needs a database.
# The extras are needed: api/tests and viewer/tests import fastapi (extras api, viewer), the MV plotting tests
# need matplotlib (extra plots) and are skipped without it. uv takes the Python version from .python-version.
name: Tests

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Importing pylovo needs database settings; nothing connects to a database here.
      DBNAME: ci
      DBUSER: ci
      PASSWORD: ci
      HOST: 127.0.0.1
      PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run the tests
        run: uv run --locked --extra api --extra plots --extra viewer pytest -q tests api/tests viewer/tests
