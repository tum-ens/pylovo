# Run the tests on pushes to main, dev, feature/** and fix/** and on pull requests.
#   lint:     ruff with the version and rules of pyproject.toml (only the dev tools are installed), and
#             requirements.txt (for pip users) is the export of uv.lock.
#   pytest:   the unit tests; the opt-in database tests skip themselves, nothing needs a database.
#   database: tests/db/run_database_tests.py, the same command as locally: builds the toy-town test database on a
#             disposable PostgreSQL 17 / PostGIS 3.5 / pgRouting 3.8 container and runs the opt-in database tests
#             against it (docs/source/development/index.rst, section "Database tests").
# The extras are needed: api/tests and viewer/tests import fastapi (extras api, viewer), the MV plotting tests
# need matplotlib (extra plots) and are skipped without it. uv takes the Python version from .python-version.
name: Tests

on:
  push:
    # feature and fix branches too, so a branch is checked before it is merged (also without a pull request)
    branches: ["main", "dev", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: ruff
        run: uv run --locked --only-dev ruff check --output-format=github

      - name: requirements.txt is the export of uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --no-annotate --no-dev > requirements.txt
          git diff --exit-code requirements.txt || {
            echo "::error file=requirements.txt::requirements.txt differs from uv.lock: run the uv export command in its first lines and commit it."
            exit 1
          }

  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Importing pylovo needs database settings; nothing connects to a database here.
      DBNAME: ci
      DBUSER: ci
      PASSWORD: ci
      HOST: 127.0.0.1
      PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Run the tests
        run: uv run --locked --extra api --extra plots --extra viewer --extra opendss pytest -q tests api/tests viewer/tests

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Install GDAL (pylovo-setup imports the transformers with ogr2ogr)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin

      - name: Run the database tests on a disposable PostgreSQL container
        run: uv run --locked --extra api --extra plots python tests/db/run_database_tests.py
