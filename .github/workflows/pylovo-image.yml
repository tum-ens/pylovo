# Build the pylovo image with the headless HTTP API pylovo-api (api/docker/Dockerfile) and publish
# it to GHCR as ghcr.io/<owner>/pylovo.
#   push to main / dev / develop / feature/**  -> tag = branch name with / -> - (feature/x -> feature-x);
#                                                 main also gets `latest`
#   push of a version tag vX.Y.Z                -> X.Y.Z and X.Y
#   every build                                 -> sha-<short commit>
#   workflow_dispatch                           -> the tags of the chosen ref
# After the first push: make the package public (GitHub: Packages -> pylovo -> Package settings)
# so that `docker pull` works without a login, or give readers `docker login ghcr.io`.
name: pylovo image

on:
  push:
    branches: ["main", "dev", "develop", "feature/**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pylovo-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (the image has ~4 GB of Python packages)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Image name (lower case owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pylovo" >> "$GITHUB_ENV"

      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=pylovo
            org.opencontainers.image.description=pylovo (synthetic LV grid generator) with its headless HTTP API pylovo-api

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: api/docker/Dockerfile
          build-args: |
            PYLOVO_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=pylovo
          cache-to: type=gha,scope=pylovo,mode=max
