LIST_OF_CLUSTERING_PARAMETERS:
- no_house_connections
- vsw_per_branch
- avg_trafo_dis
N_CLUSTERS_KMEANS: 4
N_CLUSTERS_GMM: 4
# Transform of the key figures before the factor analysis and the clustering: yeo-johnson (one power transform per
# key figure, against their long tails), log1p (log(1 + x) in the unit of the figure) or none (standardisation only)
TRANSFORM: yeo-johnson
# Also filter the grids below the four lower limits (pylovo-classify writes the answer of its question)
ADDITIONAL_FILTERING: false
# Leave out the grids whose power flow violates the voltage limits or does not converge: the generation could not
# meet its own design limits there. Grids with one building or without households stay in (the small filling grids).
EXCLUDE_INFEASIBLE: true
# Upper limits, always applied
THRESHOLD_MAX_TRAFO_DIS: 2.5
THRESHOLD_HOUSEHOLDS_PER_BUILDING: 150
# Lower limits of the additional filtering: the means of k-means cluster 0 (the small filling grids) of one
# classification over 100 PLZ that clustered with exactly these four parameters, on grids of May 2025 (shipped since 0.3.0).
# Re-derive them with: python -m pylovo.classification.utils.get_average_values_clustering_parameters
THRESHOLD_AVG_TRAFO_DIS: 0.115
THRESHOLD_NO_HOUSE_CONNECTIONS: 14.332
THRESHOLD_VSW_PER_BRANCH: 0.258
THRESHOLD_NO_HOUSEHOLDS: 35.316
CLUSTERING_PARAMETERS:
- version_id
- plz
- bcid
- kcid
- no_connection_buses
- no_branches
- no_house_connections
- no_house_connections_per_branch
- no_households
- no_household_equ
- no_household_equ_per_branch
- max_household_equ_of_a_branch
- house_distance_km
- transformer_mva
- osm_trafo
- max_trafo_dis
- avg_trafo_dis
- cable_length_km
- cable_len_per_house
- max_power_mw
- simultaneous_peak_load_mw
- resistance
- reactance
- ratio
- vsw_per_branch
- max_vsw_of_a_branch
