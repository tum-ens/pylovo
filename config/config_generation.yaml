# =============================================================================
# EXECUTION CONFIGURATION
# =============================================================================
VERSION_ID: "1" # Change version if you changed any grid parameters or queries (e.g. transformer query)
VERSION_COMMENT: default # State here which parameters, queries are used to compute the grids with current VERSION_ID
PARALLEL: True # Use multiple workers in parallel
N_JOBS_PERCENT: 20  # Set percentage of CPU cores to be used for parallel grid generation
ANALYZE_GRIDS: True # Run basic analysis after grid generation
LOG_LEVEL: INFO #DEBUG, INFO, ERROR - Logging configurations
SAVE_GRID_FOLDER: False # save grid json files as json additionally to db storage
RESULT_DIR: results # Directory for storing analysis results and outputs

# =============================================================================
# GRID GENERATION CONFIGURATION
# =============================================================================
ELECTRICAL_BACKEND: pandapower # Electrical backend configuration - Options: 'pandapower', 'opendss'
RESIDENTIAL_ONLY_GENERATION: False # apply grid generation based on residential buildings only
PEAK_LOAD_HOUSEHOLD: 16.825 # 14.5kW, ~15% of buildings have 30 kW with electric hot water supply
DEFAULT_POWER_FACTOR: 0.95  # cos(phi) for residential loads

### Consumer categories for load calculation
CONSUMER_CATEGORIES:
  - {consumer_category_id: 1, definition: Commercial, peak_load: null, yearly_consumption: null, peak_load_per_m2: 79.00, yearly_consumption_per_m2: 245.70, sim_factor: 0.50}
  - {consumer_category_id: 2, definition: Public, peak_load: null, yearly_consumption: null, peak_load_per_m2: 29.00, yearly_consumption_per_m2: 155.70, sim_factor: 0.60}
  - {consumer_category_id: 3, definition: Residential, peak_load: PEAK_LOAD_HOUSEHOLD, yearly_consumption: 0.00, peak_load_per_m2: null, yearly_consumption_per_m2: null, sim_factor: 0.07}


### CABLE DIMENSIONING PARAMETERS
VN: 400  # Nominal voltage in the low voltage grid

# Voltage planning may upsize conductors, but parallel counts remain determined by ampacity.

# Max. approximate voltage drop from the transformer LV bus to any service connection point.
MAX_END_TO_END_FEEDER_VOLTAGE_DROP_PERCENT: 8 # 80% Leistungsgrenze of 0.10 p.u. DIN EN 50160

# Max. service cable voltage drop at its building-local coincident load.
MAX_SERVICE_DESIGN_VOLTAGE_DROP_PERCENT: 3 

# Commercial/Public buildings above this peak load are assumed to use a dedicated MV-side connection
MV_DIRECT_CONNECTION_LOAD_THRESHOLD_KW: 100

# Max. simultaneous current allowed while grouping nodes into one planned feeder branch.
# This is a topology-splitting parameter; cable sizing still uses the feeder-cable catalogue afterward.
# Shared upstream prefixes can carry several planned branches and may exceed this value; those sections are
# handled by feeder cable dimensioning with larger/parallel cables instead of forcing another topology split.
FEEDER_SPLIT_MAX_CURRENT_KA: 0.850

# Min. routed distance from transformer to an existing upstream split point before a later branch may reuse that point instead of starting as a separate transformer feeder. Switch the feature off by setting a very high value.
MIN_SHARED_PREFIX_LENGTH_M: 50

# Conservative open-data proxy for DSO HaAn aggregation: nearby street-side connection points
# are merged only when they share the same street identifier/name and form a small local cluster.
AGGREGATE_NEARBY_CONNECTION_POINTS: False
CONNECTION_POINT_AGGREGATION_RADIUS_M: 15
CONNECTION_POINT_AGGREGATION_MAX_BUILDINGS: 4

# =============================================================================
# TRANSFORMER PLACEMENT PARAMETERS
# =============================================================================
# Settlement_types thresholds
RURAL_MAX_HOUSEHOLDS: 1.3 # Maximum average number of households per building for rural settlements
URBAN_MIN_HOUSEHOLDS: 3.2 # Minimum average number of households per building for urban settlements
RURAL_MIN_BUILDING_DISTANCE: 55 # Minimum average distance between buildings for rural settlements
URBAN_MAX_BUILDING_DISTANCE: 20 # Maximum average distance between buildings for urban settlements

### Transformer mapping: Settlement Type (1=low/rural,2=medium/semi-urban,3=high/urban) -> Allowed Transformer Capacities (s_max_kva)
TRANSFORMER_MAPPING:
  1: [250, 400, 630]
  2: [400, 630]
  3: [400, 630]

# =============================================================================
# Clustering PARAMETERS
# =============================================================================

## KMeans
MAX_BUILDINGS_PER_KCID: 1000 # Maximum number of load buildings per initial k-means cluster
K_MEANS_SEED: 3329829316 # k-means integer seed to ensure deterministic behavior

## Greenfield
MAX_GREENFIELD_TRAFO_DISTANCE: 2000 # Maximum distance from a greenfield transformer to any cluster connection point
MERGE_GREENFIELD_CLUSTERS: True # Merge neighboring greenfield clusters as posprocessing step
GREENFIELD_CLUSTER_MERGE_TRANSFORMER_KVA: [400] # Select transformer capacities for merging

## Brownfield
MAX_BROWNFIELD_TRAFO_DISTANCE: 1000 # Maximum assignment distance to an existing brownfield transformer
USE_OPEN_TRANSFORMER_POSITIONS: False # Include non-DSO open/manual transformer positions from pylovo.transformers
USE_DSO_TRANSFORMER_POSITIONS: True # Include imported DSO transformer positions from pylovo.transformers


# =============================================================================
