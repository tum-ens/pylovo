# =============================================================================
# ANALYSIS AND PLOTTING CONFIGURATION
# =============================================================================
# This file contains settings for grid analysis, plotting, and municipal register

# =============================================================================
# POWER-FLOW ASSESSMENT
# =============================================================================
# Post-solution thresholds used to classify a converged power flow. These limits
# do not constrain solver convergence and do not influence grid topology or cable sizing.
POWER_FLOW_VOLTAGE_LIMITS:
  MIN_VM_PU: 0.9
  MAX_VM_PU: 1.1

# =============================================================================
# PLOTTING CONFIGURATION
# =============================================================================
# Color mapping for different transformer sizes in plots
PLOT_COLOR_DICT:
  100: gold
  160: orange
  200: darkorange
  250: peru
  315: orangered
  400: red
  515: crimson
  500: crimson
  630: purple
  715: blue
  800: darkblue
  1260: black

# =============================================================================
# COLOR PALETTES
# =============================================================================
PALETTES:
  # Standard palette (6 colors)
  TUMPalette:
    - '#0065BD'  # TUMBlue
    - '#A2AD00'  # TUMGreen
    - '#E37222'  # TUMOrange
    - '#98C6EA'  # TUMBlue4
    - '#7F7F7F'  # TUMGray2
    - '#005293'  # TUMBlue2

  # Extended palette with ivory (7 colors)
  TUMPalette1:
    - '#0065BD'  # TUMBlue
    - '#A2AD00'  # TUMGreen
    - '#E37222'  # TUMOrange
    - '#DAD7CB'  # TUMIvory
    - '#98C6EA'  # TUMBlue4
    - '#005293'  # TUMBlue2
    - '#7F7F7F'  # TUMGray2

# =============================================================================
# NETWORK VISUALIZATION COLORS
# =============================================================================
NETWORK_COLORS:
  NODE_COLOR_TRAFO: '#DAD7CB'      # TUMIvory
  NODE_COLOR_CONSUMER: '#98C6EA'   # TUMBlue4
  NODE_COLOR_CONNECTION_BUS: '#A2AD00'  # TUMGreen

# =============================================================================
# MUNICIPAL REGISTER CONFIGURATION
# =============================================================================
# Define the columns that should be included in the municipal register
# These columns are used for regional data analysis and grid generation
MUNICIPAL_REGISTER:
  - plz
  - pop
  - area
  - lat
  - lon
  - ags
  - name_city
  - fed_state
  - regio7
  - regio5
  - pop_den
