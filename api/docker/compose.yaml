# Run pylovo-api in a container next to an existing database (e.g. InfDB):
#   PYLOVO_REVISION=$(git rev-parse HEAD) docker compose -f api/docker/compose.yaml up --build
# Then check http://127.0.0.1:18765/api/health. The API uses the .env, config/ and data/ of this
# checkout. PYLOVO_REVISION is what /api/health reports as the revision (without it: null).
#
# The mounted files and folders must exist before the first start: a `.env` with the database
# settings (cp .env.example .env, then edit it) and `mkdir -p .pylovo-api log`. Otherwise compose
# stops with "bind source path does not exist" instead of creating them (as folders owned by root,
# which the container user cannot write to). The container runs as user id 1000: mounted folders
# must be writable for that id, or set `user:` below.
services:
  pylovo-api:
    build:
      context: ../..
      dockerfile: api/docker/Dockerfile
      args:
        PYLOVO_REVISION: ${PYLOVO_REVISION:-}
    image: pylovo
    # Host networking: the API keeps listening on 127.0.0.1 only, and a database on the host
    # (HOST=localhost or the host's address in .env) is reachable as it is for the CLI.
    network_mode: host
    volumes:
      - {type: bind, source: ../../.env, target: /app/.env, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ../../config, target: /app/config, bind: {create_host_path: false}}
      - {type: bind, source: ../../data, target: /app/data, bind: {create_host_path: false}}
      - {type: bind, source: ../../log, target: /app/log, bind: {create_host_path: false}}
      - {type: bind, source: ../../.pylovo-api, target: /app/.pylovo-api, bind: {create_host_path: false}}
